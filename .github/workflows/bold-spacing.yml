name: 🔗 检查加粗空格
on:
  pull_request:
    paths:
      - "**/*.md"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: 检查加粗标记两侧空格
        run: python .github/scripts/check_bold_spacing.py
